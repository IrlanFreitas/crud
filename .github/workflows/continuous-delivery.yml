name: "[CD] Continuous Delivery"

# Usar para controle de branch main, para subir uma versao em prod
# on:
#     push:
#         branches: [main]

on:
  pull_request:
    types: [opened, synchronize]

env:
  VERCEL_ORG_ID: team_84skKkPToHpDvADHbtEbl9r1
  VERCEL_PROJECT_ID: prj_xX3T5AvWJj2iqAJYi5fSSfk84IPT

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      ## [COMMON_CI_Steps]
      - uses: actions/checkout@v3
      ## =================
      - name: "Debug"
        run: "ls -la"
      ## Poderia ser utilizado o 'npm install' mas
      ## no caso do processo de CI/CD é mais interessante e performatico
      ## utilizar o comando 'npm ci' que instala apenas o necessário
      ## para executar a pipeline
      - name: "Install Dependencies"
        run: "npm ci"
      - name: "Deploy"
        run: "npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}"
